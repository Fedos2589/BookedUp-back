services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bookedup
      POSTGRES_PASSWORD: bookedup
      POSTGRES_DB: bookedup
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookedup']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://bookedup:bookedup@postgres:5432/bookedup?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ['api']

volumes:
  postgres-data:
