# Builds the API image and pushes it to GHCR, tagged with the commit sha. Started by hand from main;
# the sha in the run summary is what `deploy.sh` takes.
name: Release

on: workflow_dispatch

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Only main is released: a branch's image must never reach the server.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/fedos2589/bookedup-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "Image ghcr.io/fedos2589/bookedup-api:${{ github.sha }} — pass \`${{ github.sha }}\` to deploy.sh" >> "$GITHUB_STEP_SUMMARY"
